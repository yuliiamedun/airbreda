services:
  air-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env

  traffic-ingest:
    build:
      context: .
      dockerfile: Dockerfile.traffic
    env_file: .env
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws