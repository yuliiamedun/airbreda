services:
  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [airbreda]

  air-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: air-ingest
    env_file: .env
    depends_on: [redis]
    networks: [airbreda]

  traffic-ingest:
    build:
      context: .
      dockerfile: Dockerfile.traffic
    container_name: traffic-ingest
    env_file: .env
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    depends_on: [redis]
    networks: [airbreda]

networks:
  airbreda: